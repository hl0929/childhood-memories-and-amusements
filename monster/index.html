<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf4">
  <title>怪兽塔防</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <div class="container">
    <a class="back" href="../index.html">← 返回</a>
    <h1>👾 怪兽塔防</h1>

    <div class="game-info">
      <div class="score-board"><span class="label">金币</span><span id="coins">120</span></div>
      <div class="score-board"><span class="label">生命</span><span id="lives">20</span></div>
      <div class="score-board"><span class="label">关卡</span><span id="level">1/10</span></div>
      <div class="score-board"><span class="label">波次</span><span id="wave">0/2</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="game"></canvas>
      <div id="kill-badge" class="wave-badge">击杀 0</div>

      <div id="tower-panel" class="tower-panel hidden">
        <span id="tower-name">箭塔 Lv.1</span>
        <button id="upgrade-btn" class="panel-btn">升级</button>
        <button id="sell-btn" class="panel-btn sell">出售</button>
      </div>

      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <p id="overlay-title">怪兽塔防</p>
          <p id="overlay-sub">选择武器 → 点击空地建造 · 点击已建武器升级</p>
        </div>
      </div>
    </div>

    <div class="tower-bar" id="tower-bar">
      <button class="tower-card" data-tower="arrow" aria-label="箭塔">
        <span class="emoji">🏹</span><span class="name">箭塔</span><span class="cost">🪙 40</span>
      </button>
      <button class="tower-card" data-tower="cannon" aria-label="炮塔">
        <span class="emoji">💣</span><span class="name">炮塔</span><span class="cost">🪙 70</span>
      </button>
      <button class="tower-card" data-tower="frost" aria-label="冰塔">
        <span class="emoji">❄️</span><span class="name">冰塔</span><span class="cost">🪙 60</span>
      </button>
      <button class="tower-card" data-tower="tesla" aria-label="电塔">
        <span class="emoji">⚡</span><span class="name">电塔</span><span class="cost">🪙 90</span>
      </button>
      <button class="tower-card" data-tower="poison" aria-label="毒塔">
        <span class="emoji">🧪</span><span class="name">毒塔</span><span class="cost">🪙 80</span>
      </button>
    </div>

    <div class="btn-row">
      <button id="pause-btn" class="game-btn">⏸ 暂停</button>
      <button id="restart-btn" class="game-btn">🔄 重开</button>
    </div>

    <div class="controls">选武器 → 点空地建造 &nbsp;|&nbsp; 点已建武器升级 / 出售 &nbsp;|&nbsp; P 暂停 &nbsp;|&nbsp; R 重开</div>
  </div>

  <script src="../sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
