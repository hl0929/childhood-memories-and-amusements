<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf4">
  <title>扫雷</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <div class="container">
    <a class="back" href="../index.html">← 返回</a>
    <h1>💣 扫雷</h1>
    <div class="game-info">
      <div class="score-board"><span class="label">剩余雷数</span><span id="mines-left">10</span></div>
      <div class="score-board"><span class="label">用时</span><span id="timer">0s</span></div>
    </div>
    <div class="difficulty">
      <button class="diff-btn active" data-rows="9" data-cols="9" data-mines="10">初级</button>
      <button class="diff-btn" data-rows="16" data-cols="16" data-mines="40">中级</button>
      <button class="diff-btn" data-rows="16" data-cols="30" data-mines="99">高级</button>
    </div>
    <div id="board" class="board"></div>
    <div class="controls">左键翻开 &nbsp;|&nbsp; 右键/长按 标旗 &nbsp;|&nbsp; 高级难度可横向滑动 &nbsp;|&nbsp; R 重新开始</div>
    <div id="msg" class="msg hidden">
      <div class="msg-box">
        <p id="msg-title"></p>
        <p id="msg-sub"></p>
        <button onclick="initGame()">再来一局</button>
      </div>
    </div>
  </div>
    <script src="../sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
