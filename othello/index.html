<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf4">
  <title>黑白棋</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../common.css">
</head>
<body>
  <div class="container">
    <a class="back" href="../index.html">← 返回</a>
    <h1>⚫️ 黑白棋</h1>
    <div class="game-info">
      <div class="score-board"><span class="label">⚫ 黑棋</span><span id="black-count">2</span></div>
      <div class="score-board"><span class="label">⚪ 白棋</span><span id="white-count">2</span></div>
      <div class="score-board"><span class="label">当前</span><span id="current-turn">⚫</span></div>
    </div>
    <div class="mode-row">
      <button id="mode-ai" class="game-btn active">vs AI</button>
      <button id="mode-2p" class="game-btn">双人</button>
    </div>
    <div id="board" class="board"></div>
    <div class="btn-row">
      <button id="restart-btn" class="game-btn">🔄 新局</button>
    </div>
    <div class="controls">点击落子，翻转对方被夹住的棋子</div>
    <div id="msg" class="msg hidden">
      <div class="msg-box">
        <p id="msg-title"></p>
        <p id="msg-sub"></p>
        <button onclick="initGame()">再来一局</button>
      </div>
    </div>
  </div>
    <script src="../sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
